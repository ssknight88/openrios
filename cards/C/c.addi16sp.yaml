# c.addi16sp · 按 card.template.v1.yaml 第三稿；语义抄 Sail（803f192b），本体：ExecuteAs(ITYPE(imm, sp, sp, ADDI))，imm = sign_extend(nzimm @ 0x0)
# Sail 定位（本地 803f192b 核对）：extensions/C/zca_insts.sail execute(C_ADDI16SP) L189–L192
# 语义已核（2026-09-10，按 803f192b 取公开仓库原文）；行号见「Sail 定位」行（本地 _golden 803f192b 核对）
# UDB 0a3a1e2 已核（本地 _golden，inst\C\c.addi16sp.yaml）：aliases · hints · access 已按其填写；definedBy · encoding 已交叉核对

template: A1-v1

card:
  key: c.addi16sp
  verified: null

decode:
  extension: Zca
  xlen: null
  mnemonic: c.addi16sp
  aliases: []
  encoding:
    pattern: "011 . 00010 . . .. . 01"
    fields: {nzimm: "12:s1 3:2 5:1 2:1 6:1 <<4"}
    assembly: "sp, nzimm"
    # 填不进⑯（16 位编码记法 · 归 A 自身）：编码格式.md 只定义了 32 位记法；本卡按同一记法写 16 字符图案。
    #   3 位寄存器字段（rd' rs1' rs2'）经 creg2reg_idx 映到 x8..x15（f 寄存器同理映 f8..f15），记法里没有「+8」的写法，此处只在注释说明
  overlap: []
  reserved: 
    - {when: "nzimm=0"}                # Sail encdec when nzimm != 0b000000

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []

operand_fetch:
  operands:
    - {type: imm, id: nzimm}
  implicit_reads: [X(sp)]

calculate:
  - {out: imm, width: 12, op: "sign_extend(imm @ 0x0)"}          # Sail let imm : bits(12)
  - {out: immext, width: 64, op: "sign_extend(imm)"}   # 本体 ITYPE：12 → 64
  - {out: result, width: 64, op: "X(sp) + immext"}  # 本体 ITYPE ADDI 分支

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs:
    - {type: X, id: sp, width: 64, value: result}
  csr: []
  next_pc: seq

outcome:
  retire: normal
  exceptions: []
  precision: null
  # 填不进⑭（指向本体 · 归 A 自身）：Sail 子句是 ExecuteAs(本体)，方案 §2.1 说「压缩指令只有 Decode + 指向本体」，
  #   但模板没有「指向本体」的键。本卡实验做法：Decode 全填，其余六步按本体展开、操作数代换，本体见卡头。
  #   代价是与本体卡重复；好处是列查询（方案 §1.1）在本卡上仍能工作。要不要开 decode.expands_to 之类的键，review 定
  # 填不进⑮（固定寄存器 · 归 A 自身）：源和目的都是 sp（x2），编码里 11..7 固定 00010。operands[].id 必须是 encoding.fields 的名，固定寄存器（sp · ra · x0）不是字段；本卡X(sp) 进 implicit_reads，update.regs 的 id 直接写 sp
