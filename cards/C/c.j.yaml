# c.j · 按 card.template.v1.yaml 第三稿；语义抄 Sail（803f192b），本体：ExecuteAs(JAL(sign_extend(imm @ 0b0), zreg))
# Sail 定位（本地 803f192b 核对）：extensions/C/zca_insts.sail execute(C_J) L370–L371
# 语义已核（2026-09-10，按 803f192b 取公开仓库原文）；行号见「Sail 定位」行（本地 _golden 803f192b 核对）
# UDB 0a3a1e2 已核（本地 _golden，inst\C\c.j.yaml）：aliases · hints · access 已按其填写；definedBy · encoding 已交叉核对

template: A1-v1

card:
  key: c.j
  verified: null

decode:
  extension: Zca
  xlen: null
  mnemonic: c.j
  aliases: []
  encoding:
    pattern: "101 . . .. . . . ... . 01"
    fields: {imm: "12:s1 8:1 9:2 6:1 7:1 2:1 11:1 3:3 <<1"}
    assembly: "imm"
    # 填不进⑯（16 位编码记法 · 归 A 自身）：编码格式.md 只定义了 32 位记法；本卡按同一记法写 16 字符图案。
    #   3 位寄存器字段（rd' rs1' rs2'）经 creg2reg_idx 映到 x8..x15（f 寄存器同理映 f8..f15），记法里没有「+8」的写法，此处只在注释说明
  overlap: []
  reserved: []

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []

operand_fetch:
  operands:
    - {type: imm, id: imm}
  implicit_reads: [PC]

calculate:
  - {out: link_address, width: 64, op: "get_next_pc()"}                 # 本体 JAL；压缩形态下 = PC + 2
  - {out: target, width: 64, op: "PC + sign_extend(imm @ 0b0)"}         # 本体 imm 形参 = sign_extend(imm @ 0b0)，再 sign_extend 合一

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs: []                              # 本体 rd = zreg，写入丢弃
  csr: []
  next_pc: target

outcome:
  retire: normal
  exceptions:
    - {when: "bit_to_bool(target[1]) & not(currentlyEnabled(Ext_Zca))", cause: E_Fetch_Addr_Align, tval: target}
      # jump_to；本卡存在即 Zca 已启用，此条恒假
  precision: param:PRECISE_SYNCHRONOUS_EXCEPTIONS
  # 填不进⑭（指向本体 · 归 A 自身）：Sail 子句是 ExecuteAs(本体)，方案 §2.1 说「压缩指令只有 Decode + 指向本体」，
  #   但模板没有「指向本体」的键。本卡实验做法：Decode 全填，其余六步按本体展开、操作数代换，本体见卡头。
  #   代价是与本体卡重复；好处是列查询（方案 §1.1）在本卡上仍能工作。要不要开 decode.expands_to 之类的键，review 定
  # 填不进⑮（固定寄存器 · 归 A 自身）：rd 是 zreg，不在编码里。operands[].id 必须是 encoding.fields 的名，固定寄存器（sp · ra · x0）不是字段；本卡regs 留空并注明
  # 填不进⑨：jump_to 的 ext_control_check_pc 路径，同 cards/I/jal.yaml
