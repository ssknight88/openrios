# c.srai · 按 card.template.v1.yaml 第三稿；语义抄 Sail（803f192b），本体：ExecuteAs(SHIFTIOP(shamt, rsd, rsd, SRAI))
# Sail 定位（本地 803f192b 核对）：extensions/C/zca_insts.sail execute(C_SRAI) L241–L244
# 语义已核（2026-09-10，按 803f192b 取公开仓库原文）；行号见「Sail 定位」行（本地 _golden 803f192b 核对）
# UDB 0a3a1e2 已核（本地 _golden，inst\C\c.srai.yaml）：aliases · hints · access 已按其填写；definedBy · encoding 已交叉核对

template: A1-v1

card:
  key: c.srai
  verified: null

decode:
  extension: Zca
  xlen: null
  mnemonic: c.srai
  aliases: []
  encoding:
    pattern: "100 . 01 ... ..... 01"
    fields: {shamt: "12:1 2:5", rsd: "7:3"}
    assembly: "rsd, shamt"
    # 填不进⑯（16 位编码记法 · 归 A 自身）：编码格式.md 只定义了 32 位记法；本卡按同一记法写 16 字符图案。
    #   3 位寄存器字段（rd' rs1' rs2'）经 creg2reg_idx 映到 x8..x15（f 寄存器同理映 f8..f15），记法里没有「+8」的写法，此处只在注释说明
  overlap: []                           # shamt=0（RV64）与 rsd=x0（c.slli）是 HINT
  reserved: []                          # Sail encdec when (xlen == 64 | shamt[5] == 0b0)；RV64 下 shamt 6 位全合法

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []

operand_fetch:
  operands:
    - {type: X, id: rsd}
    - {type: imm, id: shamt}
  implicit_reads: []

calculate:
  - {out: shamt, width: 6, op: "shamt[log2_xlen - 1 .. 0]"}   # Sail let shamt 遮蔽同名编码字段（RV64 取 6 位）——填不进⑬（let 同名重绑定）
  - {out: result, width: 64, op: "shift_bits_right_arith(X(rsd), shamt)"}   # 本体 SHIFTIOP 原话已核（本地 803f192b）
    # 填不进⑦（XLEN 编码分歧）：RV32 下 shamt[5] 必须为 0，见 slli.yaml

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs:
    - {type: X, id: rsd, width: 64, value: result}
  csr: []
  next_pc: seq

outcome:
  retire: normal
  exceptions: []
  precision: null
  # 填不进⑭（指向本体 · 归 A 自身）：Sail 子句是 ExecuteAs(本体)，方案 §2.1 说「压缩指令只有 Decode + 指向本体」，
  #   但模板没有「指向本体」的键。本卡实验做法：Decode 全填，其余六步按本体展开、操作数代换，本体见卡头。
  #   代价是与本体卡重复；好处是列查询（方案 §1.1）在本卡上仍能工作。要不要开 decode.expands_to 之类的键，review 定
