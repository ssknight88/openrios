# fmin.d · 按 card.template.v1.yaml 第三稿；语义抄 Sail FD/dext_insts.sail execute(F_BIN_F_TYPE_D)（803f192b）
# Sail 定位（本地 803f192b 核对）：extensions/FD/dext_insts.sail execute(F_BIN_F_TYPE_D) L718–L736
# 语义已核（2026-09-10，按 803f192b 取公开仓库原文）；行号见「Sail 定位」行（本地 _golden 803f192b 核对）
# UDB 0a3a1e2 已核（本地 _golden，inst\D\fmin.d.yaml）：aliases · hints · access 已按其填写；definedBy · encoding 已交叉核对
#
# 子句原文：
#   let rs1_val_D = F_or_X_D(rs1); let rs2_val_D = F_or_X_D(rs2);
#   let is_quiet = true; let (rs1_lt_rs2, fflags) = fle_D (rs1_val_D, rs2_val_D, is_quiet);
#   let rd_val_D = <七段 if-else，见 calculate>;
#   accrue_fflags(fflags); F_or_X_D(rd) = rd_val_D; RETIRE_SUCCESS

template: A1-v1

card:
  key: fmin.d
  verified: null

decode:
  extension: D
  # extension 吸收了 Sail encdec 的 when haveSingleFPU()/haveDoubleFPU() = currentlyEnabled(Ext_F/D) | currentlyEnabled(Ext_Zfinx)，
  # 而 currentlyEnabled(Ext_F) = hartSupports(Ext_F) & misa[F] == 0b1 & currentlyEnabled(Ext_Zicsr) & mstatus[FS] != 0b00 &
  #   (if inVirtualPrivilege() then vsstatus[FS] != 0b00 else true)
  # 即「FS = Off → 非法」藏在 extension 这一格里（模板注 ⁽¹⁾ 的约定），本卡 dynamic_check 不再重复。Zfinx 不在本轮范围
  xlen: null
  mnemonic: fmin.d
  aliases: []
  encoding:
    pattern: "0010101 ..... ..... 000 ..... 1010011"
    fields: {rs2: "20:5", rs1: "15:5", rd: "7:5"}
    assembly: "rd, rs1, rs2"
  overlap: []
  reserved: []

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []
operand_fetch:
  operands:
    - {type: F, id: rs1}
    - {type: F, id: rs2}
  implicit_reads: []

calculate:
  - {out: rs1_val_D, width: 64, op: "F_or_X_D(rs1)"}
  - {out: rs2_val_D, width: 64, op: "F_or_X_D(rs2)"}
  - {out: is_quiet, width: 1, op: "true"}
  - {out: rs1_lt_rs2, width: 1, op: "fle_D (rs1_val_D, rs2_val_D, is_quiet)"}   # 元组 (rs1_lt_rs2, fflags)，见 ⑱
  - {out: fflags, width: 5, op: "fle_D (rs1_val_D, rs2_val_D, is_quiet)"}
  - {out: rd_val_D, width: 64, op: "if (f_is_NaN_D(rs1_val_D) & f_is_NaN_D(rs2_val_D)) then canonical_NaN_D() else if f_is_NaN_D(rs1_val_D) then rs2_val_D else if f_is_NaN_D(rs2_val_D) then rs1_val_D else if (f_is_neg_zero_D(rs1_val_D) & f_is_pos_zero_D(rs2_val_D)) then rs1_val_D else if (f_is_neg_zero_D(rs2_val_D) & f_is_pos_zero_D(rs1_val_D)) then rs2_val_D else if rs1_lt_rs2 then rs1_val_D else rs2_val_D"}
    # 值表达式 if-链原样抄（§2.3 第 6 条不适用：这是值不是动作）

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs:
    - {type: F, id: rd, width: 64, value: rd_val_D}
  csr:
    - {csr: fcsr, field: FFLAGS, value: "fcsr[FFLAGS] | fflags"}          # accrue_fflags：new_fflags = fcsr[FFLAGS] | flags
    - {csr: mstatus, field: FS, value: "extStatus_map(Dirty)"}            # accrue_fflags → dirty_fd_context_if_present（条件见下）；wF → dirty_fd_context（无条件）
    - {csr: mstatus, field: SD, value: "0b1"}
      # 填不进④：accrue_fflags 里 FS 置脏是条件的 —— set_dirty 按 fflags_dirty_policy ∈ {Precise: fflags 变了才置 · Flag: flags ≠ 0 才置 · Instruction: 恒置}；
      #   update.csr[] 无 when，本卡写成无条件（本指令另有 F 寄存器写，wF 会无条件置脏，故对 F 写指令结果等价；对只写 X 的指令不等价）
      # 填不进⑤：fflags 是 fcsr 的 [4:0] 视图（read_CSR 0x001 = zero_extend(fcsr[FFLAGS])）；dirty_fd_context 在 inVirtualPrivilege() 时还写 vsstatus[FS] / [SD]；登记哪个名字要 C 模板定
  next_pc: seq

outcome:
  retire: normal
  exceptions: []                        # 浮点运算不抛异常（结果与 fflags 承载）；Illegal 由 dynamic_check 出
  precision: null
