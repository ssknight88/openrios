# fmsub.s · 按 card.template.v1.yaml 第三稿；语义抄 Sail FD/fext_insts.sail execute(F_MADD_TYPE_S)（803f192b）
# Sail 定位（本地 803f192b 核对）：extensions/FD/fext_insts.sail execute(F_MADD_TYPE_S) L365–L387
# 语义已核（2026-09-10，按 803f192b 取公开仓库原文）；行号见「Sail 定位」行（本地 _golden 803f192b 核对）
# UDB 0a3a1e2 已核（本地 _golden，inst\F\fmsub.s.yaml）：aliases · hints · access 已按其填写；definedBy · encoding 已交叉核对
#
# 子句原文：
#   let rs1_val_32b = F_or_X_S(rs1); let rs2_val_32b = F_or_X_S(rs2); let rs3_val_32b = F_or_X_S(rs3);
#   match (select_instr_or_fcsr_rm (rm)) { None() => Illegal_Instruction(), Some(rm') => {
#     let rm_3b = encdec_rounding_mode(rm');
#     let (fflags, rd_val_32b) : (bits(5), bits(32)) = match op { … FMSUB_S => riscv_f32MulAdd (rm_3b, rs1_val_32b, rs2_val_32b, negate_S (rs3_val_32b)), … };
#     accrue_fflags(fflags); F_or_X_S(rd) = rd_val_32b; RETIRE_SUCCESS } }

template: A1-v1

card:
  key: fmsub.s
  verified: null

decode:
  extension: F
  # extension 吸收了 Sail encdec 的 when haveSingleFPU()/haveDoubleFPU() = currentlyEnabled(Ext_F/D) | currentlyEnabled(Ext_Zfinx)，
  # 而 currentlyEnabled(Ext_F) = hartSupports(Ext_F) & misa[F] == 0b1 & currentlyEnabled(Ext_Zicsr) & mstatus[FS] != 0b00 &
  #   (if inVirtualPrivilege() then vsstatus[FS] != 0b00 else true)
  # 即「FS = Off → 非法」藏在 extension 这一格里（模板注 ⁽¹⁾ 的约定），本卡 dynamic_check 不再重复。Zfinx 不在本轮范围
  xlen: null
  mnemonic: fmsub.s
  aliases: []
  encoding:
    pattern: "..... 00 ..... ..... ... ..... 1000111"
    fields: {rs3: "27:5", rs2: "20:5", rs1: "15:5", rm: "12:3", rd: "7:5"}
    assembly: "rd, rs1, rs2, rs3, rm"
  overlap: []
  reserved: []

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: 
    - {when: "select_instr_or_fcsr_rm(rm) == None()", params: [rm, fcsr.FRM, param:fcsr_rm_reserved_behavior], raise: Illegal_Instruction}
      # 原文 match (select_instr_or_fcsr_rm (rm)) { None() => Illegal_Instruction(), Some(rm') => {…} }，按 §2.3 第 6 条拆 match 臂。
      # select_instr_or_fcsr_rm：rm == RM_DYN 时读 fcsr[FRM]，非法值按 fcsr_rm_reserved_behavior 选 Fatal / Illegal；否则 Some(rm)。
      # 读 fcsr.FRM 是规则参数（§2.4 第一条边界），归 params 不归 implicit_reads；fcsr.FRM 是 C 项

operand_fetch:
  operands:
    - {type: F, id: rs1}
    - {type: F, id: rs2}
    - {type: F, id: rs3}
    - {type: imm, id: rm}
  implicit_reads: []

calculate:
  - {out: rs1_val_32b, width: 32, op: "F_or_X_S(rs1)"}   # F_or_X_S = F_S(i)（hartSupports(Ext_F)）；rF_S = nan_unbox(F(i))：高 32 位非全 1 → canonical_NaN（fdext_regs.sail L245–L249）
  - {out: rs2_val_32b, width: 32, op: "F_or_X_S(rs2)"}
  - {out: rs3_val_32b, width: 32, op: "F_or_X_S(rs3)"}
  - {out: "rm'", width: null, op: "select_instr_or_fcsr_rm(rm)"}   # Some 的载荷；枚举
  - {out: rm_3b, width: 3, op: "encdec_rounding_mode(rm')"}
  - {out: fflags, width: 5, op: "riscv_f32MulAdd (rm_3b, rs1_val_32b, rs2_val_32b, negate_S (rs3_val_32b))"}   # FMSUB_S 分支
  - {out: rd_val_32b, width: 32, op: "riscv_f32MulAdd (rm_3b, rs1_val_32b, rs2_val_32b, negate_S (rs3_val_32b))"}
    # 填不进⑱（元组 let · 归 A 自身）：Sail 一条 let (fflags, rd_val_32b) = riscv_f32MulAdd (rm_3b, rs1_val_32b, rs2_val_32b, negate_S (rs3_val_32b)) 同时绑定两个名字，
    # 模板 {out, width, op} 一条只绑一个。本卡拆成两条、op 相同；两条合起来才是原话。见 缺口清单.md

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs:
    - {type: F, id: rd, width: 32, value: rd_val_32b}   # F_or_X_S(rd) = … → wF_or_X_S → F_S(i) = data → wF；wF_S：F(i) = nan_box(data)，高 32 位置 1（fdext_regs.sail L251–L255）
  csr:
    - {csr: fcsr, field: FFLAGS, value: "fcsr[FFLAGS] | fflags"}          # accrue_fflags：new_fflags = fcsr[FFLAGS] | flags
    - {csr: mstatus, field: FS, value: "extStatus_map(Dirty)"}            # accrue_fflags → dirty_fd_context_if_present（条件见下）；wF → dirty_fd_context（无条件）
    - {csr: mstatus, field: SD, value: "0b1"}
      # 填不进④：accrue_fflags 里 FS 置脏是条件的 —— set_dirty 按 fflags_dirty_policy ∈ {Precise: fflags 变了才置 · Flag: flags ≠ 0 才置 · Instruction: 恒置}；
      #   update.csr[] 无 when，本卡写成无条件（本指令另有 F 寄存器写，wF 会无条件置脏，故对 F 写指令结果等价；对只写 X 的指令不等价）
      # 填不进⑤：fflags 是 fcsr 的 [4:0] 视图（read_CSR 0x001 = zero_extend(fcsr[FFLAGS])）；dirty_fd_context 在 inVirtualPrivilege() 时还写 vsstatus[FS] / [SD]；登记哪个名字要 C 模板定
  next_pc: seq

outcome:
  retire: normal
  exceptions: []                        # 浮点运算不抛异常（结果与 fflags 承载）；Illegal 由 dynamic_check 出
  precision: null
