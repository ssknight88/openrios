# fmv.w.x · 按 card.template.v1.yaml 第三稿；语义抄 Sail FD/fext_insts.sail execute(F_UN_TYPE_F_S)（803f192b）
# Sail 定位（本地 803f192b 核对）：extensions/FD/fext_insts.sail execute(F_UN_TYPE_F_S) L907–L912
# 语义已核（2026-09-10，按 803f192b 取公开仓库原文）；行号见「Sail 定位」行（本地 _golden 803f192b 核对）
# UDB 0a3a1e2 已核（本地 _golden，inst\F\fmv.w.x.yaml）：aliases · hints · access 已按其填写；definedBy · encoding 已交叉核对
#
# 子句原文：
#   F(rd) = nan_box(X(rs1)[31..0]); RETIRE_SUCCESS
#   nan_box(n, x) = ones('m - 'n) @ x

template: A1-v1

card:
  key: fmv.w.x
  verified: null

decode:
  extension: F
  # extension 吸收了 Sail encdec 的 when haveSingleFPU()/haveDoubleFPU() = currentlyEnabled(Ext_F/D) | currentlyEnabled(Ext_Zfinx)，
  # 而 currentlyEnabled(Ext_F) = hartSupports(Ext_F) & misa[F] == 0b1 & currentlyEnabled(Ext_Zicsr) & mstatus[FS] != 0b00 &
  #   (if inVirtualPrivilege() then vsstatus[FS] != 0b00 else true)
  # 即「FS = Off → 非法」藏在 extension 这一格里（模板注 ⁽¹⁾ 的约定），本卡 dynamic_check 不再重复。Zfinx 不在本轮范围
  xlen: null
  mnemonic: fmv.w.x
  aliases:                              # UDB pseudoinstructions（本地 0a3a1e2）
    - {name: fmv.s.x, when: "always"}
  encoding:
    pattern: "1111000 00000 ..... 000 ..... 1010011"
    fields: {rs1: "15:5", rd: "7:5"}
    assembly: "rd, rs1"
  overlap: []
  reserved: []

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []
operand_fetch:
  operands:
    - {type: X, id: rs1}
  implicit_reads: []

calculate:
  - {out: result, width: 64, op: "nan_box(X(rs1)[31..0])"}   # 32 → 64 高位全 1

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs:
    - {type: F, id: rd, width: 64, value: result}   # F(rd) = … → wF → dirty_fd_context()
  csr:
    - {csr: mstatus, field: FS, value: "extStatus_map(Dirty)"}   # wF → dirty_fd_context()
    - {csr: mstatus, field: SD, value: "0b1"}
      # 填不进⑤：inVirtualPrivilege() 时还写 vsstatus[FS] / [SD]，视图归 C
  next_pc: seq

outcome:
  retire: normal
  exceptions: []                        # 浮点运算不抛异常（结果与 fflags 承载）；Illegal 由 dynamic_check 出
  precision: null
