# fsgnj.s · 按 card.template.v1.yaml 第三稿；语义抄 Sail FD/fext_insts.sail execute(F_BIN_TYPE_F_S)（803f192b）
# Sail 定位（本地 803f192b 核对）：extensions/FD/fext_insts.sail execute(F_BIN_TYPE_F_S) L737–L746
# 语义已核（2026-09-10，按 803f192b 取公开仓库原文）；行号见「Sail 定位」行（本地 _golden 803f192b 核对）
# UDB 0a3a1e2 已核（本地 _golden，inst\F\fsgnj.s.yaml）：aliases · hints · access 已按其填写；definedBy · encoding 已交叉核对
#
# 子句原文：
#   let rs1_val_S = F_or_X_S(rs1); let rs2_val_S = F_or_X_S(rs2);
#   let (s1, e1, m1) = fsplit_S (rs1_val_S); let (s2, e2, m2) = fsplit_S (rs2_val_S);
#   let rd_val_S = fmake_S (s2, e1, m1);
#   F_or_X_S(rd) = rd_val_S; RETIRE_SUCCESS

template: A1-v1

card:
  key: fsgnj.s
  verified: null

decode:
  extension: F
  # extension 吸收了 Sail encdec 的 when haveSingleFPU()/haveDoubleFPU() = currentlyEnabled(Ext_F/D) | currentlyEnabled(Ext_Zfinx)，
  # 而 currentlyEnabled(Ext_F) = hartSupports(Ext_F) & misa[F] == 0b1 & currentlyEnabled(Ext_Zicsr) & mstatus[FS] != 0b00 &
  #   (if inVirtualPrivilege() then vsstatus[FS] != 0b00 else true)
  # 即「FS = Off → 非法」藏在 extension 这一格里（模板注 ⁽¹⁾ 的约定），本卡 dynamic_check 不再重复。Zfinx 不在本轮范围
  xlen: null
  mnemonic: fsgnj.s
  aliases:                              # UDB pseudoinstructions（本地 0a3a1e2）
    - {name: fmv.s, when: "rs2=rs1"}
  encoding:
    pattern: "0010000 ..... ..... 000 ..... 1010011"
    fields: {rs2: "20:5", rs1: "15:5", rd: "7:5"}
    assembly: "rd, rs1, rs2"
  overlap: []
  reserved: []

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []
operand_fetch:
  operands:
    - {type: F, id: rs1}
    - {type: F, id: rs2}
  implicit_reads: []

calculate:
  - {out: rs1_val_S, width: 32, op: "F_or_X_S(rs1)"}
  - {out: rs2_val_S, width: 32, op: "F_or_X_S(rs2)"}
  - {out: s1, width: 1, op: "fsplit_S (rs1_val_S)"}   # 三元组 (s1, e1, m1)，拆三条，见 ⑱
  - {out: e1, width: 8, op: "fsplit_S (rs1_val_S)"}
  - {out: m1, width: 23, op: "fsplit_S (rs1_val_S)"}
  - {out: s2, width: 1, op: "fsplit_S (rs2_val_S)"}   # e2 · m2 未被引用，按「定义了没人用」不列（out 名闭合查不出）
  - {out: rd_val_S, width: 32, op: "fmake_S (s2, e1, m1)"}
    # 填不进⑱（元组 let · 归 A 自身）：Sail 一条 let (fflags, e1, m1) = fsplit_S (…) 同时绑定两个名字，
    # 模板 {out, width, op} 一条只绑一个。本卡拆成两条、op 相同；两条合起来才是原话。见 缺口清单.md

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs:
    - {type: F, id: rd, width: 32, value: rd_val_S}
  csr:
    - {csr: mstatus, field: FS, value: "extStatus_map(Dirty)"}   # wF → dirty_fd_context()
    - {csr: mstatus, field: SD, value: "0b1"}
      # 填不进⑤：inVirtualPrivilege() 时还写 vsstatus[FS] / [SD]，视图归 C
  next_pc: seq

outcome:
  retire: normal
  exceptions: []                        # 浮点运算不抛异常（结果与 fflags 承载）；Illegal 由 dynamic_check 出
  precision: null
  # 无 fflags 写：fsgnj 族不调 accrue_fflags
