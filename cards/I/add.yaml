# add · 按 card.template.v1.yaml 第三稿；语义抄 Sail I/base_insts.sail execute(RTYPE) L237–L249（803f192b）
# Sail 定位（本地 803f192b 核对）：extensions/I/base_insts.sail execute(RTYPE) L237–L251

template: A1-v1

card:
  key: add
  verified: null

decode:
  extension: I
  xlen: null
  mnemonic: add
  aliases: []                           # UDB 无 pseudoinstructions
  encoding:
    pattern: "0000000 ..... ..... 000 ..... 0110011"   # Sail L225
    fields: {rs2: "20:5", rs1: "15:5", rd: "7:5"}
    assembly: "rd, rs1, rs2"
  overlap:                              # rd=x0 且 rs1=x0 时被 Zihintntl 借用；UDB hints[] 四条
    - {when: "rd=x0, rs1=x0, rs2=x2", is: hint, of: ntl.p1}
    - {when: "rd=x0, rs1=x0, rs2=x3", is: hint, of: ntl.pall}
    - {when: "rd=x0, rs1=x0, rs2=x4", is: hint, of: ntl.s1}
    - {when: "rd=x0, rs1=x0, rs2=x5", is: hint, of: ntl.all}
    # 其余 rd=x0 形态是 spec HINT 表「designated for future standard use」，UDB 不记，归编码空间一节
  reserved: []
  # UDB 另有 data_independent_timing: true（Zkt），无槽位

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []

operand_fetch:
  operands:
    - {type: X, id: rs1}
    - {type: X, id: rs2}
  implicit_reads: []

calculate:
  - {out: result, width: 64, op: "X(rs1) + X(rs2)"}   # Sail L239：xlenbits 模加，进位丢弃；Sail 无 let，直接 X(rd) = …

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs:
    - {type: X, id: rd, width: 64, value: result}     # Sail L238
  csr: []
  next_pc: seq

outcome:
  retire: normal                        # Sail L248 RETIRE_SUCCESS
  exceptions: []
  precision: null                       # 不 trap，不适用
