# sw · 按 card.template.v1.yaml 第三稿；语义抄 Sail I/base_insts.sail execute(STORE) L316–L331 + sys/vmem_utils.sail vmem_write L338–L347 / vmem_write_addr L216–（803f192b），width = 4
# Sail 定位（本地 803f192b 核对）：extensions/I/base_insts.sail execute(STORE) L316–L331

template: A1-v1

card:
  key: sw
  verified: null

decode:
  extension: I
  xlen: null
  mnemonic: sw
  aliases: []
  encoding:
    pattern: "....... ..... ..... 010 ..... 0100011"   # Sail L312–L314：width_enc(4)=010；when width <= xlen_bytes
    fields: {imm: "25:s7 7:5", rs2: "20:5", rs1: "15:5"}   # UDB location 31-25|11-7
    assembly: "rs2, imm(rs1)"
  overlap: []
  reserved: []

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []

operand_fetch:
  operands:
    - {type: X, id: rs1}
    - {type: X, id: rs2}
    - {type: imm, id: imm}
  implicit_reads: []

calculate:
  - {out: offset, width: 64, op: "sign_extend(imm)"}   # Sail L317
  - {out: vaddr, width: 64, op: "X(rs1) + offset"}     # vmem_write L339–L341
  - {out: data, width: 32, op: "X(rs2)[31..0]"}        # Sail L326：X(rs2)[width * 8 - 1 .. 0]

memory:
  request:
    type: W
    width: 32
    address: vaddr
    aq: null
    rl: null
    read: null
    modify: null
    write: {out: data, width: 32}                         # Sail L327：vmem_write(…, 4, data, Store(Data))
  va_constraint: null                   # 指令不要求对齐
  context: null

update:
  regs: []
  csr: []
  next_pc: seq

outcome:
  retire: normal                        # Sail L328
  exceptions:
    - {rule: "memory-attr(W)", cause: [E_SAMO_Addr_Align, E_SAMO_Access_Fault, E_SAMO_Page_Fault], tval: vaddr}
      # vmem_write_addr L221–L227 对齐（配置 6 / 7 / 不抛）· 翻译 → 15 · PMA / PMP → 7
  precision: param:PRECISE_SYNCHRONOUS_EXCEPTIONS
