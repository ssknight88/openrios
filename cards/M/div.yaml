# div · 按 card.template.v1.yaml 第三稿；语义抄 Sail M/mext_insts.sail execute(DIV)（803f192b），is_unsigned = false
# Sail 定位（本地 803f192b 核对）：extensions/M/mext_insts.sail execute(DIV) L53–L64
# 语义已核（2026-09-10，按 803f192b 取公开仓库原文）；行号见「Sail 定位」行（本地 _golden 803f192b 核对）
# UDB 0a3a1e2 已核（本地 _golden，inst\M\div.yaml）：aliases · hints · access 已按其填写；definedBy · encoding 已交叉核对
#
# 子句原文：
#   function clause execute DIV(rs2, rs1, rd, is_unsigned) = {
#     let rs1_bits = X(rs1);
#     let rs2_bits = X(rs2);
#     let rs1_int = if is_unsigned then unsigned(rs1_bits) else signed(rs1_bits);
#     let rs2_int = if is_unsigned then unsigned(rs2_bits) else signed(rs2_bits);
#     let quotient = if rs2_int == 0 then -1 else quot_round_zero(rs1_int, rs2_int);
#     let quotient = if not(is_unsigned) & quotient >= 2 ^ (xlen - 1) then negate(2 ^ (xlen - 1)) else quotient;
#     X(rd) = to_bits_truncate(quotient);
#     RETIRE_SUCCESS
#   }
# encdec when：currentlyEnabled(Ext_M)

template: A1-v1

card:
  key: div
  verified: null

decode:
  extension: M
  xlen: null
  mnemonic: div
  aliases: []
  encoding:
    pattern: "0000001 ..... ..... 100 ..... 0110011"   # 100 = 0b10 @ bool_bit(is_unsigned)
    fields: {rs2: "20:5", rs1: "15:5", rd: "7:5"}
    assembly: "rd, rs1, rs2"
  overlap: []                           # rd=x0 是 spec HINT 表保留形态
  reserved: []

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []

operand_fetch:
  operands:
    - {type: X, id: rs1}
    - {type: X, id: rs2}
  implicit_reads: []

calculate:
  - {out: rs1_bits, width: 64, op: "X(rs1)"}
  - {out: rs2_bits, width: 64, op: "X(rs2)"}
  - {out: rs1_int, width: null, op: "if is_unsigned then unsigned(rs1_bits) else signed(rs1_bits)"}   # int 非位串；is_unsigned = false（译码常量）
  - {out: rs2_int, width: null, op: "if is_unsigned then unsigned(rs2_bits) else signed(rs2_bits)"}
  - {out: quotient, width: null, op: "if rs2_int == 0 then -1 else quot_round_zero(rs1_int, rs2_int)"}   # 除零 → -1（全 1）
  - {out: quotient, width: null, op: "if not(is_unsigned) & quotient >= 2 ^ (xlen - 1) then negate(2 ^ (xlen - 1)) else quotient"}
    # 填不进⑬（let 同名重绑定 · 归 A 自身）：Sail 用两个同名 let quotient，后者遮蔽前者（有符号溢出 -2^63 / -1 → -2^63）。
    # 方案 §2.3 第 2 条「out 名 = let 名」在此产生两个同名 out；本卡照抄两条，右侧 quotient 指前一条，
    # 后续引用指后一条。out 名闭合按「名字存在」查，查不出歧义。见 缺口清单.md

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs:
    - {type: X, id: rd, width: 64, value: "to_bits_truncate(quotient)"}
  csr: []
  next_pc: seq

outcome:
  retire: normal
  exceptions: []                        # 除零 · 溢出不抛异常，spec 定义了结果值
  precision: null
