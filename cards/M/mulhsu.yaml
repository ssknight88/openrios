# mulhsu · 按 card.template.v1.yaml 第三稿；语义抄 Sail M/mext_insts.sail execute(MUL)（803f192b），mul_op = { result_part = High, signed_rs1 = Signed, signed_rs2 = Unsigned }
# Sail 定位（本地 803f192b 核对）：extensions/M/mext_insts.sail execute(MUL) L29–L34
# 语义已核（2026-09-10，按 803f192b 取公开仓库原文）；行号见「Sail 定位」行（本地 _golden 803f192b 核对）
# UDB 0a3a1e2 已核（本地 _golden，inst\M\mulhsu.yaml）：aliases · hints · access 已按其填写；definedBy · encoding 已交叉核对
#
# 子句原文：
#   function clause execute MUL(rs2, rs1, rd, mul_op) = {
#     let rs1_bits = X(rs1);
#     let rs2_bits = X(rs2);
#     X(rd) = mult_to_bits_half(xlen, mul_op.signed_rs1, mul_op.signed_rs2, rs1_bits, rs2_bits, mul_op.result_part);
#     RETIRE_SUCCESS
#   }
# encdec when：currentlyEnabled(Ext_M) | currentlyEnabled(Ext_Zmmul)

template: A1-v1

card:
  key: mulhsu
  verified: null

decode:
  extension: Zmmul                      # UDB definedBy Zmmul（M 蕴含 Zmmul）；xlsx 归 M 桶
  xlen: null
  mnemonic: mulhsu
  aliases: []
  encoding:
    pattern: "0000001 ..... ..... 010 ..... 0110011"   # encdec_mul_op(mul_op) = 010
    fields: {rs2: "20:5", rs1: "15:5", rd: "7:5"}
    assembly: "rd, rs1, rs2"
  overlap: []                           # rd=x0 是 spec HINT 表保留形态
  reserved: []

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []

operand_fetch:
  operands:
    - {type: X, id: rs1}
    - {type: X, id: rs2}
  implicit_reads: []

calculate:
  - {out: rs1_bits, width: 64, op: "X(rs1)"}
  - {out: rs2_bits, width: 64, op: "X(rs2)"}
  - {out: result, width: 64, op: "mult_to_bits_half(xlen, mul_op.signed_rs1, mul_op.signed_rs2, rs1_bits, rs2_bits, mul_op.result_part)"}
    # Sail 无 let，直接 X(rd) = …，故 out 用 result；mul_op 是译码常量：signed_rs1 = Signed · signed_rs2 = Unsigned · result_part = High

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs:
    - {type: X, id: rd, width: 64, value: "result"}
  csr: []
  next_pc: seq

outcome:
  retire: normal
  exceptions: []                        # 除零 · 溢出不抛异常，spec 定义了结果值
  precision: null
