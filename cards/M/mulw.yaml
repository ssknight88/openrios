# mulw · 按 card.template.v1.yaml 第三稿；语义抄 Sail M/mext_insts.sail execute(MULW)（803f192b）
# Sail 定位（本地 803f192b 核对）：extensions/M/mext_insts.sail execute(MULW) L98–L107
# 语义已核（2026-09-10，按 803f192b 取公开仓库原文）；行号见「Sail 定位」行（本地 _golden 803f192b 核对）
# UDB 0a3a1e2 已核（本地 _golden，inst\M\mulw.yaml）：aliases · hints · access 已按其填写；definedBy · encoding 已交叉核对
#
# 子句原文：
#   function clause execute MULW(rs2, rs1, rd) = {
#     let rs1_bits = X(rs1)[31..0];
#     let rs2_bits = X(rs2)[31..0];
#     let rs1_int = signed(rs1_bits);
#     let rs2_int = signed(rs2_bits);
#     let result32 : bits(32) = to_bits_truncate(rs1_int * rs2_int);
#     X(rd) = sign_extend(result32);
#     RETIRE_SUCCESS
#   }
# encdec when：xlen == 64 & (currentlyEnabled(Ext_M) | currentlyEnabled(Ext_Zmmul))

template: A1-v1

card:
  key: mulw
  verified: null

decode:
  extension: Zmmul
  xlen: 64                              # RV64-only
  mnemonic: mulw
  aliases: []
  encoding:
    pattern: "0000001 ..... ..... 000 ..... 0111011"
    fields: {rs2: "20:5", rs1: "15:5", rd: "7:5"}
    assembly: "rd, rs1, rs2"
  overlap: []
  reserved: []

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []

operand_fetch:
  operands:
    - {type: X, id: rs1}
    - {type: X, id: rs2}
  implicit_reads: []

calculate:
  - {out: rs1_bits, width: 32, op: "X(rs1)[31..0]"}
  - {out: rs2_bits, width: 32, op: "X(rs2)[31..0]"}
  - {out: rs1_int, width: null, op: "signed(rs1_bits)"}
  - {out: rs2_int, width: null, op: "signed(rs2_bits)"}
  - {out: result32, width: 32, op: "to_bits_truncate(rs1_int * rs2_int)"}

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs:
    - {type: X, id: rd, width: 64, value: "sign_extend(result32)"}
  csr: []
  next_pc: seq

outcome:
  retire: normal
  exceptions: []                        # 除零 · 溢出不抛异常，spec 定义了结果值
  precision: null
