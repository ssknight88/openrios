# sinval.vma · 按 card.template.v1.yaml 第三稿；语义抄 Sail Svinval/svinval_insts.sail execute(SINVAL_VMA → ExecuteAs(SFENCE_VMA))（803f192b）
# 填不进⑭：Sail 一行 ExecuteAs(SFENCE_VMA(rs1, rs2))，本卡按本体 cards/_undecided/I/sfence.vma.yaml 展开；Svinval 的「可延迟到 sfence.w.inval 之前」语义在 Sail 里没有（等价于 sfence.vma）
# UDB 0a3a1e2 已核（本地 _golden）：definedBy · encoding.match · variables 逐位交叉核对；aliases · hints · access 按其填写

template: A1-v1

card:
  key: sinval.vma
  verified: null

decode:
  extension: Svinval
  xlen: null
  mnemonic: sinval.vma
  aliases: []
  encoding:
    pattern: "0001011 ..... ..... 000 00000 1110011"
    fields: {rs2: "20:5", rs1: "15:5"}
    assembly: "rs1, rs2"
  overlap: []
  reserved: []

dynamic_check:
  access: {s: sometimes, u: never, vs: sometimes, vu: never}
  conditions: 
    - {when: "cur_privilege == User", params: [cur_privilege], raise: Illegal_Instruction}
    - {when: "cur_privilege == Supervisor & mstatus[TVM] == 0b1", params: [cur_privilege, mstatus.TVM], raise: Illegal_Instruction}
    - {when: "cur_privilege == VirtualUser", params: [cur_privilege], raise: Virtual_Instruction}
    - {when: "cur_privilege == VirtualSupervisor & hstatus[VTVM] == 0b1", params: [cur_privilege, hstatus.VTVM], raise: Virtual_Instruction}

operand_fetch:
  operands: 
    - {type: X, id: rs1}
    - {type: X, id: rs2}
  implicit_reads: [cur_privilege, hgatp.VMID]

calculate: 
  - {out: addr, width: 64, op: "if rs1 != zreg then Some(X(rs1)) else None()"}   # 本体 SFENCE_VMA L719
  - {out: asid, width: 16, op: "if rs2 != zreg then Some(zero_extend(X(rs2)[asidlen - 1 .. 0])) else None()"}
  - {out: vmid, width: 14, op: "if cur_privilege == VirtualSupervisor then Some(get_vmid(VS_Stage)) else None()"}

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs: []
  csr: []
  next_pc: seq

outcome:
  retire: normal
  exceptions: []
  precision: param:PRECISE_SYNCHRONOUS_EXCEPTIONS
  # 填不进②：flush_TLB 无槽，同本体
