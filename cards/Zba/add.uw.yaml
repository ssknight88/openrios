# add.uw · 按 card.template.v1.yaml 第三稿；语义抄 Sail B/zba_insts.sail execute(ZBA_RTYPEUW)（803f192b）
# Sail 定位（本地 803f192b 核对）：extensions/B/zba_insts.sail execute(ZBA_RTYPEUW) L53–L56
# UDB 0a3a1e2 已核（本地 _golden）：definedBy · encoding.match · variables 逐位交叉核对；aliases · hints · access 按其填写

template: A1-v1

card:
  key: add.uw
  verified: null

decode:
  extension: Zba
  xlen: 64
  mnemonic: add.uw
  aliases:                              # UDB pseudoinstructions（本地 0a3a1e2）
    - {name: zext.w, when: "rs2=x0"}
  encoding:
    pattern: "0000100 ..... ..... 000 ..... 0111011"
    fields: {rs2: "20:5", rs1: "15:5", rd: "7:5"}
    assembly: "rd, rs1, rs2"
  overlap: []
  reserved: []

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []

operand_fetch:
  operands: 
    - {type: X, id: rs1}
    - {type: X, id: rs2}
  implicit_reads: []

calculate: 
  - {out: result, width: 64, op: "(zero_extend(X(rs1)[31..0]) << shamt) + X(rs2)"}   # ZBA_RTYPEUW，shamt = 0b00 由编码固定（Sail 构造子参数）；Sail 无 let

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs: 
    - {type: X, id: rd, width: 64, value: result}
  csr: []
  next_pc: seq

outcome:
  retire: normal
  exceptions: []
  precision: null
