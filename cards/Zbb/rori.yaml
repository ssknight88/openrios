# rori · 按 card.template.v1.yaml 第三稿；语义抄 Sail B/zbb_insts.sail execute(RORI)（803f192b）
# Sail 定位（本地 803f192b 核对）：extensions/B/zbb_insts.sail execute(RORI) L39–L43
# UDB data_independent_timing: true（Zkt），无槽位
# 填不进⑦：RV32 下 shamt 5 位，编码按 RV64 实例化
# UDB 0a3a1e2 已核（本地 _golden）：definedBy · encoding.match · variables 逐位交叉核对；aliases · hints · access 按其填写

template: A1-v1

card:
  key: rori
  verified: null

decode:
  extension: Zbb
  xlen: null
  mnemonic: rori
  aliases: []
  encoding:
    pattern: "011000 ...... ..... 101 ..... 0010011"
    fields: {shamt: "20:6", rs1: "15:5", rd: "7:5"}
    assembly: "rd, rs1, shamt"
  overlap: []
  reserved: []

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []

operand_fetch:
  operands: 
    - {type: X, id: rs1}
    - {type: imm, id: shamt}
  implicit_reads: []

calculate: 
  - {out: shamt, width: 6, op: "shamt[log2_xlen - 1 .. 0]"}   # 遮蔽同名编码字段 —— 填不进⑬
  - {out: result, width: 64, op: "X(rs1) >>> shamt"}   # Sail 无 let

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs: 
    - {type: X, id: rd, width: 64, value: result}
  csr: []
  next_pc: seq

outcome:
  retire: normal
  exceptions: []
  precision: null
