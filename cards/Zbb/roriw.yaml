# roriw · 按 card.template.v1.yaml 第三稿；语义抄 Sail B/zbb_insts.sail execute(RORIW)（803f192b）
# Sail 定位（本地 803f192b 核对）：extensions/B/zbb_insts.sail execute(RORIW) L23–L26
# UDB data_independent_timing: true（Zkt），无槽位
# UDB 0a3a1e2 已核（本地 _golden）：definedBy · encoding.match · variables 逐位交叉核对；aliases · hints · access 按其填写

template: A1-v1

card:
  key: roriw
  verified: null

decode:
  extension: Zbb
  xlen: 64
  mnemonic: roriw
  aliases: []
  encoding:
    pattern: "0110000 ..... ..... 101 ..... 0011011"
    fields: {shamt: "20:5", rs1: "15:5", rd: "7:5"}
    assembly: "rd, rs1, shamt"
  overlap: []
  reserved: []

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []

operand_fetch:
  operands: 
    - {type: X, id: rs1}
    - {type: imm, id: shamt}
  implicit_reads: []

calculate: 
  - {out: result, width: 64, op: "sign_extend(X(rs1)[31..0] >>> shamt)"}   # Sail 无 let，直接 X(rd) = …

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs: 
    - {type: X, id: rd, width: 64, value: result}
  csr: []
  next_pc: seq

outcome:
  retire: normal
  exceptions: []
  precision: null
