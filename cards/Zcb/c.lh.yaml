# c.lh · 按 card.template.v1.yaml 第三稿；语义抄 Sail（803f192b），本体：ExecuteAs(LOAD(imm, rs1, rd, false, 2))，imm = zero_extend(uimm)，uimm = uimm1 @ 0b0
# Sail 定位（本地 803f192b 核对）：extensions/C/zcb_insts.sail execute(C_LH) L59–L64
# 语义已核（2026-09-10，按 803f192b 取公开仓库原文）；行号见「Sail 定位」行（本地 _golden 803f192b 核对）
# UDB 0a3a1e2 已核（本地 _golden，inst\Zcb\c.lh.yaml）：aliases · hints · access 已按其填写；definedBy · encoding 已交叉核对

template: A1-v1

card:
  key: c.lh
  verified: null

decode:
  extension: Zcb
  xlen: null
  mnemonic: c.lh
  aliases: []
  encoding:
    pattern: "100 001 ... 1 . ... 00"
    fields: {uimm: "5:1 <<1", rs1: "7:3", rd: "2:3"}
    assembly: "rd, uimm(rs1)"
    # 填不进⑯（16 位编码记法 · 归 A 自身）：编码格式.md 只定义了 32 位记法；本卡按同一记法写 16 字符图案。
    #   3 位寄存器字段（rd' rs1' rs2'）经 creg2reg_idx 映到 x8..x15（f 寄存器同理映 f8..f15），记法里没有「+8」的写法，此处只在注释说明
  overlap: []
  reserved: []

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []

operand_fetch:
  operands:
    - {type: X, id: rs1}
    - {type: imm, id: uimm}
  implicit_reads: []

calculate:
  - {out: imm, width: 12, op: "zero_extend(uimm)"}          # Sail let imm : bits(12)
  - {out: offset, width: 64, op: "sign_extend(imm)"}  # 本体
  - {out: vaddr, width: 64, op: "X(rs1) + offset"}

memory:
  request:
    type: R
    width: 16
    address: vaddr
    aq: null
    rl: null
    read: {out: data, width: 16}        # Sail Ok(data)
    modify: null
    write: null
  va_constraint: null
  context: null

update:
  regs:
    - {type: X, id: rd, width: 64, value: "sign_extend(data)"}   # 本体 LOAD：extend_value
  csr: []
  next_pc: seq

outcome:
  retire: normal
  exceptions:
    - {rule: "memory-attr(R)", cause: [E_Load_Addr_Align, E_Load_Access_Fault, E_Load_Page_Fault], tval: vaddr}
  precision: param:PRECISE_SYNCHRONOUS_EXCEPTIONS
  # 填不进⑭（指向本体 · 归 A 自身）：Sail 子句是 ExecuteAs(本体)，方案 §2.1 说「压缩指令只有 Decode + 指向本体」，
  #   但模板没有「指向本体」的键。本卡实验做法：Decode 全填，其余六步按本体展开、操作数代换，本体见卡头。
  #   代价是与本体卡重复；好处是列查询（方案 §1.1）在本卡上仍能工作。要不要开 decode.expands_to 之类的键，review 定
