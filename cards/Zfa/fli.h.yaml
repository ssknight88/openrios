# fli.h · 按 card.template.v1.yaml 第三稿；语义抄 Sail FD/zfa_insts.sail execute(FLI_H)（803f192b）
# Sail 定位（本地 803f192b 核对）：extensions/FD/zfa_insts.sail execute(FLI_H) L22–L61
# extension 吸收了 Sail encdec 的 when（currentlyEnabled(Ext_F/D/Zfh…)，内含 mstatus[FS] != 0b00）—— 模板注 ⁽¹⁾ 约定，dynamic_check 不再重复
# xlsx M/O = Optional（RVA23 里可选；本轮按用户指示一并做）
# UDB 0a3a1e2 已核（本地 _golden）：definedBy · encoding.match · variables 逐位交叉核对；aliases · hints · access 按其填写

template: A1-v1

card:
  key: fli.h
  verified: null

decode:
  extension: Zfa
  xlen: null
  mnemonic: fli.h
  aliases: []
  encoding:
    pattern: "1111010 00001 ..... 000 ..... 1010011"
    fields: {constantidx: "15:5", rd: "7:5"}
    assembly: "rd, constantidx"
  overlap: []
  reserved: []

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []

operand_fetch:
  operands: 
    - {type: imm, id: constantidx}
  implicit_reads: []

calculate: 
  - {out: bits, width: 16, op: "match constantidx { 0b00000 => { 0xbc00 }, 0b00001 => { 0x0400 }, 0b00010 => { 0x0100 }, 0b00011 => { 0x0200 }, 0b00100 => { 0x1c00 }, 0b00101 => { 0x2000 }, 0b00110 => { 0x2c00 }, 0b00111 => { 0x3000 }, 0b01000 => { 0x3400 }, 0b01001 => { 0x3500 }, 0b01010 => { 0x3600 }, 0b01011 => { 0x3700 }, 0b01100 => { 0x3800 }, 0b01101 => { 0x3900 }, 0b01110 => { 0x3a00 }, 0b01111 => { 0x3b00 }, 0b10000 => { 0x3c00 }, 0b10001 => { 0x3d00 }, 0b10010 => { 0x3e00 }, 0b10011 => { 0x3f00 }, 0b10100 => { 0x4000 }, 0b10101 => { 0x4100 }, 0b10110 => { 0x4200 }, 0b10111 => { 0x4400 }, 0b11000 => { 0x4800 }, 0b11001 => { 0x4c00 }, 0b11010 => { 0x5800 }, 0b11011 => { 0x5c00 }, 0b11100 => { 0x7800 }, 0b11101 => { 0x7c00 }, 0b11110 => { 0x7c00 }, 0b11111 => { canonical_NaN_H() } }"}   # 32 臂常数表，逐字

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs: 
    - {type: F, id: rd, width: 16, value: bits}
  csr: 
    - {csr: mstatus, field: FS, value: "extStatus_map(Dirty)"}
    - {csr: mstatus, field: SD, value: "0b1"}
  next_pc: seq

outcome:
  retire: normal
  exceptions: []
  precision: null
  # 填不进⑤：wF 置脏 FS/SD；inVirtualPrivilege() 时还写 vsstatus
