# UDB 0a3a1e2 已核（本地 _golden）：definedBy · encoding.match · variables 逐位交叉核对；aliases · hints · access 按其填写

template: A1-v1

card:
  key: fli.s
  verified: null

decode:
  extension: Zfa
  xlen: null
  mnemonic: fli.s
  aliases: []
  encoding:
    pattern: "1111000 00001 ..... 000 ..... 1010011"
    fields: {constantidx: "15:5", rd: "7:5"}
    assembly: "rd, constantidx"
  overlap: []
  reserved: []

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []

operand_fetch:
  operands: 
    - {type: imm, id: constantidx}
  implicit_reads: []

calculate: 
  - {out: bits, width: 32, op: "match constantidx { 0b00000 => { 0xbf800000 }, 0b00001 => { 0x00800000 }, 0b00010 => { 0x37800000 }, 0b00011 => { 0x38000000 }, 0b00100 => { 0x3b800000 }, 0b00101 => { 0x3c000000 }, 0b00110 => { 0x3d800000 }, 0b00111 => { 0x3e000000 }, 0b01000 => { 0x3e800000 }, 0b01001 => { 0x3ea00000 }, 0b01010 => { 0x3ec00000 }, 0b01011 => { 0x3ee00000 }, 0b01100 => { 0x3f000000 }, 0b01101 => { 0x3f200000 }, 0b01110 => { 0x3f400000 }, 0b01111 => { 0x3f600000 }, 0b10000 => { 0x3f800000 }, 0b10001 => { 0x3fa00000 }, 0b10010 => { 0x3fc00000 }, 0b10011 => { 0x3fe00000 }, 0b10100 => { 0x40000000 }, 0b10101 => { 0x40200000 }, 0b10110 => { 0x40400000 }, 0b10111 => { 0x40800000 }, 0b11000 => { 0x41000000 }, 0b11001 => { 0x41800000 }, 0b11010 => { 0x43000000 }, 0b11011 => { 0x43800000 }, 0b11100 => { 0x47000000 }, 0b11101 => { 0x47800000 }, 0b11110 => { 0x7f800000 }, 0b11111 => { canonical_NaN_S() } }"}   # 32 臂常数表，逐字

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs: 
    - {type: F, id: rd, width: 32, value: bits}
  csr: 
    - {csr: mstatus, field: FS, value: "extStatus_map(Dirty)"}
    - {csr: mstatus, field: SD, value: "0b1"}
  next_pc: seq

outcome:
  retire: normal
  exceptions: []
  precision: null
  # 填不进⑤：wF 置脏 FS/SD；inVirtualPrivilege() 时还写 vsstatus
