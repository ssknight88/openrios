# fminm.d · 按 card.template.v1.yaml 第三稿；语义抄 Sail FD/zfa_insts.sail execute(FMINM_D)（803f192b）
# Sail 定位（本地 803f192b 核对）：extensions/FD/zfa_insts.sail execute(FMINM_D) L298–L316
# extension 吸收了 Sail encdec 的 when（currentlyEnabled(Ext_F/D/Zfh…)，内含 mstatus[FS] != 0b00）—— 模板注 ⁽¹⁾ 约定，dynamic_check 不再重复
# UDB 0a3a1e2 已核（本地 _golden）：definedBy · encoding.match · variables 逐位交叉核对；aliases · hints · access 按其填写

template: A1-v1

card:
  key: fminm.d
  verified: null

decode:
  extension: Zfa
  xlen: null
  mnemonic: fminm.d
  aliases: []
  encoding:
    pattern: "0010101 ..... ..... 010 ..... 1010011"
    fields: {rs2: "20:5", rs1: "15:5", rd: "7:5"}
    assembly: "rd, rs1, rs2"
  overlap: []
  reserved: []

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []

operand_fetch:
  operands: 
    - {type: F, id: rs1}
    - {type: F, id: rs2}
  implicit_reads: []

calculate: 
  - {out: rs1_val_D, width: 64, op: "F_D(rs1)"}
  - {out: rs2_val_D, width: 64, op: "F_D(rs2)"}
  - {out: is_quiet, width: 1, op: "true"}
  - {out: rs1_lt_rs2, width: 1, op: "fle_D (rs1_val_D, rs2_val_D, is_quiet)"}   # 元组 (rs1_lt_rs2, fflags)，⑱
  - {out: fflags, width: 5, op: "fle_D (rs1_val_D, rs2_val_D, is_quiet)"}
  - {out: rd_val_D, width: 64, op: "if (f_is_NaN_D(rs1_val_D) | f_is_NaN_D(rs2_val_D)) then canonical_NaN_D() else if (f_is_neg_zero_D(rs1_val_D) & f_is_pos_zero_D(rs2_val_D)) then rs1_val_D else if (f_is_neg_zero_D(rs2_val_D) & f_is_pos_zero_D(rs1_val_D)) then rs2_val_D else if rs1_lt_rs2 then rs1_val_D else rs2_val_D"}   # 值 if-链原样抄；与 fmin/fmax 的差别：任一 NaN 即 canonical_NaN（IEEE 754-2019 minimum/maximum）

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs: 
    - {type: F, id: rd, width: 64, value: rd_val_D}
  csr: 
    - {csr: fcsr, field: FFLAGS, value: "fcsr[FFLAGS] | fflags"}
    - {csr: mstatus, field: FS, value: "extStatus_map(Dirty)"}
    - {csr: mstatus, field: SD, value: "0b1"}
  next_pc: seq

outcome:
  retire: normal
  exceptions: []
  precision: null
  # 填不进④：accrue_fflags 里 FS 置脏按 fflags_dirty_policy 是条件的；update.csr[] 无 when。本指令另有 F 写（wF 无条件置脏），结果等价
  # 填不进⑤：fflags 是 fcsr[4:0] 的视图；inVirtualPrivilege() 时还写 vsstatus[FS]/[SD]。登记名字待 C 模板
