# froundnx.s · 按 card.template.v1.yaml 第三稿；语义抄 Sail FD/zfa_insts.sail execute(FROUNDNX_S)（803f192b）
# Sail 定位（本地 803f192b 核对）：extensions/FD/zfa_insts.sail execute(FROUNDNX_S) L447–L463
# extension 吸收了 Sail encdec 的 when（currentlyEnabled(Ext_F/D/Zfh…)，内含 mstatus[FS] != 0b00）—— 模板注 ⁽¹⁾ 约定，dynamic_check 不再重复
# UDB 0a3a1e2 已核（本地 _golden）：definedBy · encoding.match · variables 逐位交叉核对；aliases · hints · access 按其填写

template: A1-v1

card:
  key: froundnx.s
  verified: null

decode:
  extension: Zfa
  xlen: null
  mnemonic: froundnx.s
  aliases: []
  encoding:
    pattern: "0100000 00101 ..... ... ..... 1010011"
    fields: {rs1: "15:5", rm: "12:3", rd: "7:5"}
    assembly: "rd, rs1, rm"
  overlap: []
  reserved: []

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: 
    - {when: "select_instr_or_fcsr_rm(rm) == None()", params: [rm, fcsr.FRM, param:fcsr_rm_reserved_behavior], raise: Illegal_Instruction}

operand_fetch:
  operands: 
    - {type: F, id: rs1}
    - {type: imm, id: rm}
  implicit_reads: []

calculate: 
  - {out: rs1_val_S, width: 32, op: "F_S(rs1)"}
  - {out: "rm'", width: null, op: "select_instr_or_fcsr_rm(rm)"}
  - {out: rm_3b, width: 3, op: "encdec_rounding_mode(rm')"}
  - {out: fflags, width: 5, op: "riscv_f32roundToInt(rm_3b, rs1_val_S, true)"}   # 元组 (fflags, rd_val_S)，⑱
  - {out: rd_val_S, width: 32, op: "riscv_f32roundToInt(rm_3b, rs1_val_S, true)"}   # 末参 exact = true：froundnx 报 NX

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs: 
    - {type: F, id: rd, width: 32, value: rd_val_S}
  csr: 
    - {csr: fcsr, field: FFLAGS, value: "fcsr[FFLAGS] | fflags"}
    - {csr: mstatus, field: FS, value: "extStatus_map(Dirty)"}
    - {csr: mstatus, field: SD, value: "0b1"}
  next_pc: seq

outcome:
  retire: normal
  exceptions: []
  precision: null
  # 填不进④：accrue_fflags 里 FS 置脏按 fflags_dirty_policy 是条件的；update.csr[] 无 when。本指令另有 F 写（wF 无条件置脏），结果等价
  # 填不进⑤：fflags 是 fcsr[4:0] 的视图；inVirtualPrivilege() 时还写 vsstatus[FS]/[SD]。登记名字待 C 模板
