# ntl.s1 · 按 card.template.v1.yaml 第三稿；语义抄 Sail Zihintntl/zihintntl_insts.sail execute(NTL)（803f192b）
# Sail 定位（本地 803f192b 核对）：extensions/Zihintntl/zihintntl_insts.sail execute(NTL) L21–L21
# UDB 0a3a1e2 已核（本地 _golden）：definedBy · encoding.match · variables 逐位交叉核对；aliases · hints · access 按其填写

template: A1-v1

card:
  key: ntl.s1
  verified: null

decode:
  extension: Zihintntl
  xlen: null
  mnemonic: ntl.s1
  aliases: []
  encoding:
    pattern: "0000000 00100 00000 000 00000 0110011"
    fields: {}
    assembly: ""
  overlap: 
    - {when: "always", is: inst, of: add}   # 本卡就是 add rd=x0, rs1=x0, rs2=x4 的 HINT 形态；cards/I/add.yaml 的 overlap 反向指到本卡
  reserved: []

dynamic_check:
  access: {s: always, u: always, vs: always, vu: always}
  conditions: []

operand_fetch:
  operands: []
  implicit_reads: []

calculate: []

memory:
  request: null
  va_constraint: null
  context: null

update:
  regs: []
  csr: []
  next_pc: seq

outcome:
  retire: normal
  exceptions: []
  precision: null
  # 填不进②（事件 · 归「序」）：原文 execute NTL(_) = RETIRE_SUCCESS —— 非时序局部性提示对架构状态无影响，语义全在「序 / 缓存」侧；卡上全空
