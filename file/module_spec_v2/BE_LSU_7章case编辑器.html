<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BE-LSU §7 Case 可编辑时序图</title>
  <script src="https://unpkg.com/wavedrom@3.6.2/wavedrom.min.js"></script>
  <script src="https://unpkg.com/wavedrom@3.6.2/skins/default.js"></script>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; color: #1f2937; background: #f8fafc; }
    main { max-width: 1240px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 6px; font-size: 24px; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    p { margin: 0 0 16px; color: #64748b; }
    .panel { border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; padding: 16px; margin-bottom: 16px; }
    .controls { display: grid; grid-template-columns: minmax(260px, 1.7fr) 150px 150px; gap: 12px 16px; align-items: end; }
    label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; }
    input, select { box-sizing: border-box; width: 100%; border: 1px solid #94a3b8; border-radius: 4px; padding: 8px 9px; background: #fff; font: inherit; font-weight: 400; }
    input:focus, select:focus { outline: 2px solid #93c5fd; outline-offset: 1px; border-color: #2563eb; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    button { border: 1px solid #64748b; border-radius: 4px; background: #fff; color: #1f2937; padding: 8px 12px; cursor: pointer; font: inherit; }
    button.primary { border-color: #1d4ed8; background: #1d4ed8; color: #fff; }
    button:hover { filter: brightness(.96); }
    .status { margin: 12px 0 0; font-size: 13px; color: #334155; }
    .top-status { margin: 0 0 14px; padding: 10px 12px; min-height: 18px; border: 1px solid #bfdbfe; border-radius: 4px; background: #eff6ff; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; min-width: 900px; border-collapse: collapse; }
    th, td { padding: 8px 6px; border-bottom: 1px solid #e2e8f0; text-align: left; vertical-align: middle; }
    th { color: #475569; font-size: 12px; font-weight: 700; white-space: nowrap; }
    td input, td select { min-width: 100px; padding: 6px 7px; }
    .row-actions { display: flex; gap: 4px; white-space: nowrap; }
    .row-actions button { padding: 5px 7px; }
    #diagram { overflow-x: auto; border: 1px solid #cbd5e1; padding: 20px; background: #fff; }
    .hint { font-size: 13px; }
    @media (max-width: 700px) { main { padding: 14px; } .controls { grid-template-columns: 1fr; } }
  </style>
  <script>
    const DEFAULT_CASES = [{"id":"7_1_load_normal","title":"7.1 普通 load - 正常","status":"成立；正常 load 走 WB、bypass 和 done。","hscale":2,"signals":[{"name":"be_lsu_issue_valid","type":"pulse","start":1,"end":1},{"name":"lsu_be_issue_ready","type":"level","start":1,"end":1},{"name":"be_lsu_issue_pld","type":"data","start":1,"end":1,"label":"ISSUE"},{"name":"lsu_be_wb_valid","type":"pulse","start":3,"end":3},{"name":"be_lsu_wb_ready","type":"level","start":3,"end":3},{"name":"lsu_be_wb_pld","type":"data","start":3,"end":3,"label":"tag + load_data"},{"name":"lsu_be_bypass_valid","type":"pulse","start":3,"end":3},{"name":"lsu_be_bypass_pld","type":"data","start":3,"end":3,"label":"tag + load_data"},{"name":"lsu_be_done","type":"pulse","start":3,"end":3},{"name":"lsu_be_done_tag","type":"data","start":3,"end":3,"label":"self_tag"}]},{"id":"7_2_load_error","title":"7.2 普通 load - 出错","status":"成立；异常不发 WB，统一走 done_excp 通路。","hscale":2,"signals":[{"name":"be_lsu_issue_valid","type":"pulse","start":1,"end":1},{"name":"lsu_be_issue_ready","type":"level","start":1,"end":1},{"name":"be_lsu_issue_pld","type":"data","start":1,"end":1,"label":"ISSUE"},{"name":"lsu_be_done_excp","type":"pulse","start":3,"end":3},{"name":"lsu_be_done_excp_pld","type":"data","start":3,"end":3,"label":"cause=4/5 tval=ADDR"}]},{"id":"7_3_store_normal","title":"7.3 普通 store - 正常","status":"成立；Store 不走 WB，C1 issue 握手完成第一段，C6 wakeup，C8 done。","hscale":2,"signals":[{"name":"be_lsu_issue_valid","type":"pulse","start":1,"end":1},{"name":"lsu_be_issue_ready","type":"level","start":1,"end":1},{"name":"be_lsu_issue_pld","type":"data","start":1,"end":1,"label":"ISSUE"},{"name":"be_lsu_store_wakeup","type":"pulse","start":6,"end":6},{"name":"lsu_be_done","type":"pulse","start":8,"end":8},{"name":"lsu_be_done_tag","type":"data","start":8,"end":8,"label":"self_tag"}]},{"id":"7_4_store_execute_error","title":"7.4 普通 store - 执行拍出错","status":"成立；执行拍异常，不再发 store_wakeup。若 wakeup 已先发出，形状转为 7.5。","hscale":2,"signals":[{"name":"be_lsu_issue_valid","type":"pulse","start":1,"end":1},{"name":"lsu_be_issue_ready","type":"level","start":1,"end":1},{"name":"be_lsu_issue_pld","type":"data","start":1,"end":1,"label":"ISSUE"},{"name":"lsu_be_done_excp","type":"pulse","start":3,"end":3},{"name":"lsu_be_done_excp_pld","type":"data","start":3,"end":3,"label":"cause=6 tval=ADDR"}]},{"id":"7_5_store_wakeup_error","title":"7.5 普通 store - wakeup 之后出错","status":"成立；wakeup 已发出但内存未修改，C8 由 done_excp 报告。","hscale":2,"signals":[{"name":"be_lsu_issue_valid","type":"pulse","start":1,"end":1},{"name":"lsu_be_issue_ready","type":"level","start":1,"end":1},{"name":"be_lsu_issue_pld","type":"data","start":1,"end":1,"label":"ISSUE"},{"name":"be_lsu_store_wakeup","type":"pulse","start":6,"end":6},{"name":"lsu_be_done_excp","type":"pulse","start":8,"end":8},{"name":"lsu_be_done_excp_pld","type":"data","start":8,"end":8,"label":"cause=7 tval=ADDR"}]},{"id":"7_6_atomic_normal","title":"7.6 LR / SC / AMO - 正常","status":"成立；LR/SC/AMO 不走 store_wakeup，数据取值已标注。","hscale":2,"signals":[{"name":"be_lsu_issue_valid","type":"pulse","start":1,"end":1},{"name":"lsu_be_issue_ready","type":"level","start":1,"end":1},{"name":"be_lsu_issue_pld","type":"data","start":1,"end":1,"label":"ISSUE"},{"name":"lsu_be_wb_valid","type":"pulse","start":5,"end":5},{"name":"be_lsu_wb_ready","type":"level","start":5,"end":5},{"name":"lsu_be_wb_pld","type":"data","start":5,"end":5,"label":"LR=load / SC=0|1 / AMO=old"},{"name":"lsu_be_bypass_valid","type":"pulse","start":5,"end":5},{"name":"lsu_be_bypass_pld","type":"data","start":5,"end":5,"label":"tag + result"},{"name":"lsu_be_done","type":"pulse","start":5,"end":5},{"name":"lsu_be_done_tag","type":"data","start":5,"end":5,"label":"self_tag"}]},{"id":"7_7_atomic_error","title":"7.7 LR / SC / AMO - 出错","status":"成立；统一走 done_excp。LR 使用 4/5，SC/AMO 使用 6/7；is_store=0，无 wakeup/第二段。","hscale":2,"signals":[{"name":"be_lsu_issue_valid","type":"pulse","start":1,"end":1},{"name":"lsu_be_issue_ready","type":"level","start":1,"end":1},{"name":"be_lsu_issue_pld","type":"data","start":1,"end":1,"label":"ISSUE"},{"name":"lsu_be_done_excp","type":"pulse","start":3,"end":3},{"name":"lsu_be_done_excp_pld","type":"data","start":3,"end":3,"label":"LR:4/5; SC/AMO:6/7; tval=ADDR"}]},{"id":"7_8_fence_normal","title":"7.8 FENCE / FENCE.I - 正常","status":"成立；FENCE/FENCE.I 无 WB 数据，使用 done 完成。","hscale":2,"signals":[{"name":"be_lsu_issue_valid","type":"pulse","start":1,"end":1},{"name":"lsu_be_issue_ready","type":"level","start":1,"end":1},{"name":"be_lsu_issue_pld","type":"data","start":1,"end":1,"label":"ISSUE"},{"name":"lsu_be_done","type":"pulse","start":9,"end":9},{"name":"lsu_be_done_tag","type":"data","start":9,"end":9,"label":"self_tag"}]},{"id":"7_9_issue_backpressure","title":"7.9 issue 被反压","status":"成立；C1/C2 ready 为 0，C3 完成握手，payload 保持。","hscale":2,"signals":[{"name":"be_lsu_issue_valid","type":"level","start":1,"end":3},{"name":"be_lsu_issue_pld","type":"data","start":1,"end":3,"label":"ISSUE_A"},{"name":"lsu_be_issue_ready","type":"level","start":3,"end":3},{"name":"issue_fire = valid & ready","type":"pulse","start":3,"end":3}]}];
    const STORAGE_KEY = 'be-lsu-case-editor-v3-no-wb-backpressure';
    let caseStore = {};
    let currentCaseId = DEFAULT_CASES[0].id;
    let currentSignals = [];
    let currentSpec = null;
    let nextId = 1000;
    let currentHScale = 2;
    let customCases = {};
    let nextCaseId = 1;

    function cloneSignals(list) {
      return list.map(signal => {
        const copy = { ...signal, id: signal.id || nextId++ };
        if (copy.type === 'pulse') {
          const start = Number.parseInt(copy.start, 10);
          copy.end = (Number.isFinite(start) ? Math.max(0, start) : 0) + 1;
        }
        return copy;
      });
    }
    function allCases() { return DEFAULT_CASES.concat(Object.values(customCases)); }
    function defaultCase(id) { return allCases().find(item => item.id === id) || DEFAULT_CASES[0]; }
    function hasCase(id) { return allCases().some(item => item.id === id); }
    function caseTitle(id) {
      const definition = defaultCase(id);
      const saved = caseStore[id];
      return saved && typeof saved.title === 'string' && saved.title.trim() ? saved.title : definition.title;
    }
    function refreshCaseOptionLabels() {
      const select = document.getElementById('caseSelect');
      if (!select) return;
      Array.from(select.options).forEach(option => { option.textContent = caseTitle(option.value); });
    }
    function readNumber(value, fallback) { const result = Number.parseInt(value, 10); return Number.isFinite(result) ? Math.max(0, result) : fallback; }
    function compactWave(states) { return states.map((state, index) => index === 0 || state !== states[index - 1] ? state : '.').join(''); }
    function spanBounds(length, start, end) {
      const first = Math.max(0, Math.min(length - 1, readNumber(start, 0)));
      const requestedEnd = readNumber(end, first);
      const exclusiveEnd = requestedEnd > first ? requestedEnd : first + 1;
      return [first, Math.max(first + 1, Math.min(length, exclusiveEnd))];
    }
    function binaryWave(length, start, end) {
      const states = Array(length).fill('0');
      const [first, exclusiveEnd] = spanBounds(length, start, end);
      for (let i = first; i < exclusiveEnd; i += 1) states[i] = '1';
      return compactWave(states);
    }
    function dataWave(length, start, end, label) {
      const states = Array(length).fill('x');
      const [first, exclusiveEnd] = spanBounds(length, start, end);
      states[first] = '=';
      for (let i = first + 1; i < exclusiveEnd; i += 1) states[i] = '.';
      return { wave: states.join(''), data: [label || 'Data'] };
    }
    function waveFor(signal, cycles) {
      if (signal.type === 'clock') return { wave: 'p' + '.'.repeat(cycles - 1) };
      if (signal.type === 'data') return dataWave(cycles, signal.start, signal.end, signal.label);
      const end = signal.end;
      return { wave: binaryWave(cycles, signal.start, end) };
    }

    function saveState() {
      const titleInput = document.getElementById('caseTitle');
      const title = titleInput && titleInput.value.trim() ? titleInput.value.trim() : defaultCase(currentCaseId).title;
      if (customCases[currentCaseId]) customCases[currentCaseId].title = title;
      caseStore[currentCaseId] = {
        signals: cloneSignals(currentSignals),
        hscale: readNumber(document.getElementById('hscale').value, currentHScale),
        title,
        cycleCount: document.getElementById('cycleCount') ? readNumber(document.getElementById('cycleCount').value, 12) : 12
      };
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ caseStore, currentCaseId, nextId })); } catch (error) { /* 使用当前页面状态 */ }
      refreshCaseOptionLabels();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ caseStore, customCases, currentCaseId, nextId, nextCaseId })); } catch (error) { /* current page state */ }
    }
    function saveCurrentCase() {
      saveState();
      document.getElementById('status').textContent = '已保存：' + (document.getElementById('caseTitle').value.trim() || caseTitle(currentCaseId));
    }
    function restoreState() {
      try {
        const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (state && state.caseStore) caseStore = state.caseStore;
        if (state && state.customCases) customCases = state.customCases;
        if (state && state.currentCaseId && hasCase(state.currentCaseId)) currentCaseId = state.currentCaseId;
        if (state && state.nextId) nextId = state.nextId;
        if (state && state.nextCaseId) nextCaseId = state.nextCaseId;
      } catch (error) { /* 使用内置 case */ }
    }

    function loadCase(id) {
      saveState();
      currentCaseId = id;
      const preset = defaultCase(id);
      const saved = caseStore[id];
      const savedSignals = Array.isArray(saved) ? saved : (saved && Array.isArray(saved.signals) ? saved.signals : null);
      currentSignals = cloneSignals(savedSignals || preset.signals || []);
      currentHScale = (saved && saved.hscale) || preset.hscale || 2;
      document.getElementById('caseSelect').value = id;
      document.getElementById('caseTitle').value = (saved && typeof saved.title === 'string') ? saved.title : preset.title;
      document.getElementById('hscale').value = currentHScale;
      document.getElementById('cycleCount').value = (saved && saved.cycleCount) || 12;
      renderRows();
      renderDiagram();
    }

    function renderCaseOptions() {
      const select = document.getElementById('caseSelect');
      select.replaceChildren();
      allCases().forEach(item => { const option = document.createElement('option'); option.value = item.id; option.textContent = caseTitle(item.id); select.appendChild(option); });
      select.value = currentCaseId;
    }

    function renderRows() {
      const tbody = document.getElementById('signalRows');
      tbody.replaceChildren();
      currentSignals.forEach((signal, index) => {
        const tr = document.createElement('tr');
        const makeCell = () => document.createElement('td');
        const nameCell = makeCell(); const name = document.createElement('input'); name.type = 'text'; name.value = signal.name; name.oninput = () => { signal.name = name.value; saveState(); }; nameCell.appendChild(name);
        const typeCell = makeCell(); const type = document.createElement('select');
        [['clock', '时钟'], ['pulse', '一拍脉冲'], ['level', '持续电平'], ['data', '数据事件']].forEach(([value, text]) => { const option = document.createElement('option'); option.value = value; option.textContent = text; type.appendChild(option); });
        type.value = signal.type; type.onchange = () => { signal.type = type.value; if (signal.type === 'pulse') signal.end = readNumber(signal.start, 0) + 1; if (signal.type === 'data' && !signal.label) signal.label = 'Data'; renderRows(); saveState(); }; typeCell.appendChild(type);
        const startCell = makeCell(); const start = document.createElement('input'); start.type = 'number'; start.min = '0'; start.value = signal.start; start.oninput = () => { signal.start = readNumber(start.value, 0); if (signal.type === 'pulse') { signal.end = signal.start + 1; end.value = signal.end; } saveState(); }; startCell.appendChild(start);
        const endCell = makeCell(); const end = document.createElement('input'); end.type = 'number'; end.min = '0'; end.value = signal.end; end.disabled = signal.type === 'clock' || signal.type === 'pulse'; end.oninput = () => { signal.end = readNumber(end.value, signal.start); saveState(); }; endCell.appendChild(end);
        const labelCell = makeCell(); const label = document.createElement('input'); label.type = 'text'; label.value = signal.label || ''; label.disabled = signal.type !== 'data'; label.onchange = () => { signal.label = label.value; saveState(); }; labelCell.appendChild(label);
        label.placeholder = signal.type === 'data' ? 'Data' : '';
        label.title = signal.type === 'data' ? '默认 Data；例如 self_tag=3' : '';
        label.oninput = () => { signal.label = label.value; saveState(); };
        const actionCell = makeCell(); actionCell.className = 'row-actions';
        [['↑', -1], ['↓', 1]].forEach(([text, delta]) => { const button = document.createElement('button'); button.type = 'button'; button.textContent = text; button.disabled = (delta < 0 && index === 0) || (delta > 0 && index === currentSignals.length - 1); button.onclick = () => moveSignal(index, delta); actionCell.appendChild(button); });
        const remove = document.createElement('button'); remove.type = 'button'; remove.textContent = '删除'; remove.onclick = () => { currentSignals.splice(index, 1); renderRows(); saveState(); }; actionCell.appendChild(remove);
        [nameCell, typeCell, startCell, endCell, labelCell, actionCell].forEach(cell => tr.appendChild(cell)); tbody.appendChild(tr);
      });
    }

    function moveSignal(index, delta) { const target = index + delta; if (target < 0 || target >= currentSignals.length) return; const item = currentSignals.splice(index, 1)[0]; currentSignals.splice(target, 0, item); renderRows(); saveState(); }
    function addSignal() { currentSignals.push({ id: nextId++, name: 'new_signal', type: 'pulse', start: 0, end: 1, label: '' }); renderRows(); saveState(); }
    function createCase() {
      saveState();
      const suggestedTitle = '自定义 Case ' + nextCaseId;
      const enteredTitle = window.prompt('请输入新 Case 标题（当前 Case 会作为初始副本）', suggestedTitle);
      if (enteredTitle === null) return;
      const id = 'custom_' + nextCaseId++;
      const title = enteredTitle.trim() || suggestedTitle;
      const signals = cloneSignals(currentSignals);
      customCases[id] = { id, title, status: '用户自定义 Case', hscale: currentHScale, signals: cloneSignals(signals) };
      caseStore[id] = { signals: cloneSignals(signals), hscale: currentHScale, title, cycleCount: readNumber(document.getElementById('cycleCount').value, 12) };
      currentCaseId = id;
      currentSignals = cloneSignals(signals);
      document.getElementById('caseTitle').value = title;
      document.getElementById('hscale').value = currentHScale;
      renderCaseOptions();
      document.getElementById('caseSelect').value = id;
      renderRows();
      renderDiagram();
    }
    function resetCase() { const preset = defaultCase(currentCaseId); delete caseStore[currentCaseId]; currentSignals = cloneSignals(preset.signals); currentHScale = preset.hscale || 2; document.getElementById('hscale').value = currentHScale; renderRows(); renderDiagram(); }
    function resetAll() { localStorage.removeItem(STORAGE_KEY); window.location.reload(); }

    function renderDiagram() {
      const requestedCycles = Math.max(4, readNumber(document.getElementById('cycleCount').value, 12));
      const cycles = requestedCycles;
      const hscale = readNumber(document.getElementById('hscale').value, currentHScale);
      currentHScale = hscale;
      const signalRows = currentSignals.filter(signal => signal.name.trim()).map(signal => { const generated = waveFor(signal, cycles); const row = { name: signal.name.trim(), wave: generated.wave }; if (generated.data) row.data = generated.data; return row; });
      currentSpec = { config: { hscale }, head: { text: document.getElementById('caseTitle').value.trim(), tick: 0 }, signal: signalRows };
      const diagram = document.getElementById('diagram'); diagram.replaceChildren();
      const script = document.createElement('script'); script.type = 'WaveDrom'; script.textContent = JSON.stringify(currentSpec); diagram.appendChild(script); window.WaveDrom.ProcessAll();
      document.getElementById('status').textContent = '当前 ' + currentCaseId + '：' + signalRows.length + ' 个信号，' + cycles + ' 拍，hscale=' + hscale + '。';
      saveState();
    }

    function downloadBlob(content, fileName, type) { const blob = new Blob([content], { type }); const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = fileName; link.click(); setTimeout(() => URL.revokeObjectURL(url), 0); }
    function downloadSvg() { const svg = document.querySelector('#diagram svg.WaveDrom'); if (!svg) { window.alert('请先生成图'); return; } downloadBlob(new XMLSerializer().serializeToString(svg), currentCaseId + '.svg', 'image/svg+xml;charset=utf-8'); }
    function downloadJson() { if (!currentSpec) renderDiagram(); downloadBlob(JSON.stringify(currentSpec, null, 2), currentCaseId + '.json', 'application/json;charset=utf-8'); }

    function init() { restoreState(); renderCaseOptions(); const preset = defaultCase(currentCaseId); const saved = caseStore[currentCaseId]; const savedSignals = Array.isArray(saved) ? saved : (saved && Array.isArray(saved.signals) ? saved.signals : null); currentSignals = cloneSignals(savedSignals || preset.signals || []); currentHScale = (saved && saved.hscale) || preset.hscale || 2; document.getElementById('caseTitle').value = (saved && typeof saved.title === 'string') ? saved.title : preset.title; document.getElementById('hscale').value = currentHScale; document.getElementById('cycleCount').value = (saved && saved.cycleCount) || 12; document.getElementById('caseTitle').oninput = saveState; renderRows(); renderDiagram(); window.addEventListener('beforeunload', saveState); }
  </script>
</head>
<body onload="init()">
  <main>
    <h1>BE-LSU §7 Case 可编辑时序图</h1>
    <p>按序号选择案例，直接修改信号表后重新生成；每格已放宽，默认 hscale=2。</p>
    <section class="panel">
      <div class="controls">
        <label>选择 Case
          <select id="caseSelect" onchange="loadCase(this.value)"></select>
        </label>
        <label>每格宽度（当前 Case）
          <select id="hscale" onchange="renderDiagram()"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select>
        </label>
        <label>显示总拍数
          <input id="cycleCount" type="number" min="4" max="256" value="12" onchange="renderDiagram()">
        </label>
      </div>
      <label style="margin-top:12px">图标题
        <input id="caseTitle" type="text" onchange="renderDiagram()">
      </label>
      <p id="status" class="status top-status" role="status" aria-live="polite"></p>
      <div class="actions">
        <button type="button" onclick="createCase()">新增 Case（复制当前）</button>
        <button type="button" onclick="saveCurrentCase()">保存当前 Case</button>
        <button class="primary" type="button" onclick="renderDiagram()">生成 / 刷新图</button>
        <button type="button" onclick="addSignal()">＋ 添加信号</button>
        <button type="button" onclick="resetCase()">恢复本 Case</button>
        <button type="button" onclick="resetAll()">恢复全部默认</button>
        <button type="button" onclick="downloadSvg()">⇩ 导出当前 SVG</button>
        <button type="button" onclick="downloadJson()">⇩ 导出当前 JSON</button>
      </div>
    </section>
    <section class="panel">
      <h2>当前 Case 信号列表</h2>
      <p class="hint">一拍脉冲固定覆盖一拍，结束拍自动为起始拍 + 1；持续电平和数据事件覆盖起始拍到结束拍的区间，起止相同时按一拍处理。数据无效区的斜线表示未知值。</p>
      <div class="table-wrap"><table><thead><tr><th>信号名</th><th>类型</th><th>起始拍</th><th>结束拍</th><th>数据标签</th><th>顺序 / 操作</th></tr></thead><tbody id="signalRows"></tbody></table></div>
    </section>
    <section id="diagram"></section>
  </main>
</body>
</html>
